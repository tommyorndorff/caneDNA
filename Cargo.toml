[workspace]
resolver = "2"
members = ["crates/roddna-core", "crates/roddna-gui"]

[workspace.package]
version = "0.0.1" # x-release-please-version
edition = "2021"
license = "MIT"
repository = "https://github.com/tommyorndorff/caneDNA"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
