name: Deploy web to Cloudflare Pages

# Builds the WASM web app with Trunk and deploys the static output to
# Cloudflare Pages. Requires two repo secrets:
#   CLOUDFLARE_API_TOKEN  — token with "Cloudflare Pages: Edit" permission
#   CLOUDFLARE_ACCOUNT_ID — your Cloudflare account id
# The Pages project name is "canedna" (change below + in --project-name).
#
# If the secrets are not configured the job exits successfully without doing
# anything, so it never shows up as a spurious failure.

on:
  push:
    branches: [main]
    paths:
      - "crates/**"
      - "data/tapers.json"
      - ".github/workflows/deploy-web.yml"
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - name: Check for Cloudflare credentials
        id: guard
        run: |
          if [ -z "$CF_TOKEN" ]; then
            echo "No CLOUDFLARE_API_TOKEN secret set — skipping deploy."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4
        if: steps.guard.outputs.skip != 'true'

      - uses: dtolnay/rust-toolchain@stable
        if: steps.guard.outputs.skip != 'true'
        with:
          targets: wasm32-unknown-unknown

      - uses: Swatinem/rust-cache@v2
        if: steps.guard.outputs.skip != 'true'

      - uses: jetli/trunk-action@v0.5.0
        if: steps.guard.outputs.skip != 'true'
        with:
          version: latest

      - name: Build web bundle
        if: steps.guard.outputs.skip != 'true'
        run: cd crates/roddna-gui && trunk build --release

      - name: Deploy to Cloudflare Pages
        if: steps.guard.outputs.skip != 'true'
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy crates/roddna-gui/dist --project-name=canedna
